<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Registration | StayFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Material 3 / Stitch Inspired Tokens */
            --md-primary: #6366f1;
            --md-primary-container: #e0e0ff;
            --md-on-primary-container: #00006e;
            --md-surface: #0a0c10;
            --md-surface-variant: #1e293b;
            --md-on-surface-variant: #94a3b8;
            --md-outline: rgba(255, 255, 255, 0.12);
            --md-error: #f43f5e;

            --glass: rgba(15, 23, 42, 0.8);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;

            --radius-xl: 40px;
            --radius-l: 24px;
            --radius-m: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--md-surface);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.08), transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.05), transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }

        /* Ambient Background Elements */
        .ambient-blob {
            position: fixed;
            width: 400px;
            height: 400px;
            background: var(--md-primary);
            filter: blur(120px);
            opacity: 0.05;
            z-index: -1;
            border-radius: 50%;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 48px;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.6);
            animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--md-primary), #8b5cf6);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.3);
            transform: rotate(-5deg);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .header:hover .logo {
            transform: rotate(0deg) scale(1.1);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--md-on-surface-variant);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding-left: 4px;
        }

        .required {
            color: var(--md-error);
            margin-left: 2px;
        }

        input,
        select {
            width: 100%;
            padding: 16px 20px;
            border-radius: var(--radius-m);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--md-outline);
            color: white;
            font-size: 1rem;
            font-weight: 500;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:hover,
        select:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        input:focus,
        select:focus {
            border-color: var(--md-primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        /* Custom File Input */
        .file-drop-area {
            position: relative;
            padding: 24px;
            background: rgba(99, 102, 241, 0.03);
            border: 2px dashed var(--md-outline);
            border-radius: var(--radius-m);
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
        }

        .file-drop-area:hover {
            border-color: var(--md-primary);
            background: rgba(99, 102, 241, 0.06);
        }

        .file-drop-area input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-icon {
            font-size: 2rem;
            color: var(--md-primary);
            margin-bottom: 12px;
            opacity: 0.8;
        }

        .file-text {
            font-size: 0.85rem;
            color: var(--text-dim);
            font-weight: 500;
        }

        .btn-primary {
            width: 100%;
            padding: 18px;
            border-radius: 50px;
            /* Pill shape - Stitch style */
            background: var(--md-primary);
            color: white;
            font-size: 1.05rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            background: #4f46e5;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            margin-top: 24px;
            padding: 20px;
            border-radius: var(--radius-m);
            display: none;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.5;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .error {
            background: rgba(244, 63, 94, 0.1);
            color: #f43f5e;
            border: 1px solid rgba(244, 63, 94, 0.2);
        }

        /* Responsive Adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 32px 24px;
                border-radius: 32px;
            }

            h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>

<body>
    <div class="ambient-blob" style="top: 10%; left: 10%;"></div>
    <div class="ambient-blob" style="bottom: 10%; right: 10%; background: var(--md-error);"></div>

    <div class="container">
        <div class="header">
            <div class="logo-wrap">
                <div class="logo"><i class="fas fa-bolt"></i></div>
            </div>
            <h1>StayFlow</h1>
            <p class="subtitle">Join our premium PG community</p>
        </div>

        <form id="registrationForm">
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group" style="display: grid; grid-template-columns: 1fr; gap: 20px;">
                <div>
                    <label>Phone Number <span class="required">*</span></label>
                    <input type="tel" id="phone" placeholder="10-digit mobile number" required>
                </div>
            </div>

            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div>
                    <label>Location</label>
                    <select id="location" required>
                        <option value="Main Branch">Main Branch</option>
                        <option value="Executive Wing">Executive Wing</option>
                        <option value="Luxury Suites">Luxury Suites</option>
                    </select>
                </div>
                <div>
                    <label>Sharing</label>
                    <select id="sharingType" required>
                        <option value="1 Sharing">1 Sharing</option>
                        <option value="2 Sharing">2 Sharing</option>
                        <option value="3 Sharing">3 Sharing</option>
                        <option value="4 Sharing">4 Sharing</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Aadhaar Verification <span class="required">*</span></label>
                <div class="file-drop-area" id="dropArea">
                    <input type="file" id="aadhaar" accept="image/*,application/pdf" required>
                    <div class="file-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                    <div class="file-text" id="fileLabel">Drop Aadhaar image or click to upload</div>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">
                <span>Complete Registration</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        const API_BASE = '';
        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        const fileInput = document.getElementById('aadhaar');
        const fileLabel = document.getElementById('fileLabel');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileLabel.innerHTML = `<i class="fas fa-file-alt"></i> ${e.target.files[0].name}`;
                fileLabel.style.color = 'var(--md-primary)';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            messageDiv.style.display = 'none';

            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const location = document.getElementById('location').value;
            const sharingType = document.getElementById('sharingType').value;
            const aadhaarFile = fileInput.files[0];

            try {
                const formData = new FormData();
                formData.append('name', name);
                formData.append('phone', phone);
                formData.append('location', location);
                formData.append('sharingType', sharingType);
                formData.append('room', 'Pending');
                formData.append('rent', '0');
                formData.append('advance', '0');
                formData.append('aadhaar', aadhaarFile);

                const response = await fetch(`${API_BASE}/api/public/register`, {
                    method: 'POST',
                    body: formData
                });

                let result;
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    result = await response.json();
                } else {
                    const text = await response.text();
                    console.error('Server error response:', text);
                    throw new Error('Server returned an invalid response. The server may be starting up, please try again in 30 seconds.');
                }

                if (response.ok && result.success) {
                    messageDiv.className = 'success';
                    messageDiv.innerHTML = '✨ <b>Registration Successful!</b><br>Welcome to StayFlow. We have sent a confirmation copy to your WhatsApp number.';
                    form.reset();
                    fileLabel.innerHTML = 'Drop Aadhaar image or click to upload';
                    fileLabel.style.color = 'var(--text-dim)';
                } else {
                    throw new Error(result.error || 'Registration failed');
                }
            } catch (err) {
                messageDiv.className = 'error';
                messageDiv.innerHTML = '❌ ' + err.message + '. Please try again or contact support.';
            } finally {
                messageDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Complete Registration</span> <i class="fas fa-arrow-right"></i>';
            }
        });
    </script>
</body>

</html>
