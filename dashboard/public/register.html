<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Registration | StayFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #10b981;
            --bg: #0b0f1a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, rgba(139, 92, 246, 0.15), transparent),
                radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.1), transparent);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), #f43f5e);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            margin: 0 auto 15px;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dim);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .required {
            color: #f87171;
            margin-left: 2px;
        }

        input,
        select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .file-input-wrapper {
            position: relative;
            height: 50px;
            background: rgba(139, 92, 246, 0.1);
            border: 2px dashed var(--glass-border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .file-input-wrapper:hover {
            border-color: var(--primary);
        }

        .file-input-wrapper input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-input-label {
            font-size: 0.9rem;
            color: var(--primary-light);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            display: none;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .success {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo"><i class="fas fa-bolt"></i></div>
            <h1>StayFlow</h1>
            <p class="subtitle">Premium Resident Registration</p>
        </div>

        <form id="registrationForm">
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" id="name" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Phone Number <span class="required">*</span></label>
                <input type="tel" id="phone" placeholder="9876543210" required>
            </div>
            <div class="form-group">
                <label>Location</label>
                <select id="location" required>
                    <option value="Main Branch">Main Branch</option>
                    <option value="Executive Wing">Executive Wing</option>
                    <option value="Luxury Suites">Luxury Suites</option>
                </select>
            </div>
            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div>
                    <label>Sharing Type</label>
                    <select id="sharingType" required>
                        <option value="1 Sharing">1 Sharing</option>
                        <option value="2 Sharing">2 Sharing</option>
                        <option value="3 Sharing">3 Sharing</option>
                        <option value="4 Sharing">4 Sharing</option>
                    </select>
                </div>
                <div>
                    <label>Room Number</label>
                    <input type="text" id="room" placeholder="G1, F2..." required>
                </div>
            </div>
            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div>
                    <label>Monthly Rent</label>
                    <input type="number" id="rent" value="6000" placeholder="6000" required>
                </div>
                <div>
                    <label>Advance Paid</label>
                    <input type="number" id="advance" value="3500" placeholder="3500" required>
                </div>
            </div>
            <div class="form-group">
                <label>Aadhaar Card (Image/PDF) <span class="required">*</span></label>
                <div class="file-input-wrapper">
                    <input type="file" id="aadhaar" accept="image/*,application/pdf" required>
                    <div class="file-input-label" id="fileLabel">
                        <i class="fas fa-cloud-upload-alt"></i> Upload Aadhaar (IMG/PDF)
                    </div>
                </div>
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <i class="fas fa-check-circle"></i> Register Now
            </button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        const API_BASE = 'https://stayflow-hnm3.onrender.com';
        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        const fileInput = document.getElementById('aadhaar');
        const fileLabel = document.getElementById('fileLabel');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileLabel.innerHTML = `<i class="fas fa-file-image"></i> ${e.target.files[0].name}`;
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            messageDiv.style.display = 'none';

            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const location = document.getElementById('location').value;
            const sharingType = document.getElementById('sharingType').value;
            const room = document.getElementById('room').value;
            const rent = document.getElementById('rent').value;
            const advance = document.getElementById('advance').value;
            const aadhaarFile = fileInput.files[0];

            try {
                // Use single multipart/form-data request for reliability and auth-bypass
                const formData = new FormData();
                formData.append('name', name);
                formData.append('phone', phone);
                formData.append('location', location);
                formData.append('sharingType', sharingType);
                formData.append('room', room);
                formData.append('rent', rent);
                formData.append('advance', advance);
                formData.append('aadhaar', aadhaarFile);

                const response = await fetch(`${API_BASE}/api/public/register`, {
                    method: 'POST',
                    body: formData
                });

                let result;
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    result = await response.json();
                } else {
                    const text = await response.text();
                    console.error('Server error response:', text);
                    throw new Error('Server returned an invalid response. The server may be starting up, please try again in 30 seconds.');
                }

                if (response.ok && result.success) {
                    messageDiv.className = 'success';
                    messageDiv.innerHTML = '🎉 Success! Your registration is complete. Check your WhatsApp for the registration copy.';
                    form.reset();
                    fileLabel.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Upload Aadhaar (IMG/PDF)';
                } else {
                    throw new Error(result.error || 'Registration failed');
                }
            } catch (err) {
                messageDiv.className = 'error';
                messageDiv.innerHTML = '❌ ' + err.message + '. Please try again or contact support.';
            } finally {
                messageDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> Register Now';
            }
        });
    </script>
</body>

</html>
